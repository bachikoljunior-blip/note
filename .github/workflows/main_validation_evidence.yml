name: Main validation evidence

on:
  workflow_run:
    workflows: ["Validate and analyze"]
    types: [completed]

permissions:
  issues: write

jobs:
  record:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Record default-branch validation evidence
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const marker = '<!-- main-validate-evidence:v1 -->';
            const issueNumber = 17;
            const run = context.payload.workflow_run;
            if (!run || run.name !== 'Validate and analyze' || run.head_branch !== 'main' || run.event !== 'push') {
              core.setFailed('unexpected workflow_run payload');
              return;
            }
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            if (issue.data.state !== 'open') return;
            const body = [
              marker,
              '## Main Validate evidence',
              '',
              `- workflow_conclusion: ${run.conclusion || 'unknown'}`,
              `- head_branch: ${run.head_branch}`,
              `- head_sha: ${run.head_sha}`,
              `- source_event: ${run.event}`,
              `- run_attempt: ${run.run_attempt || 1}`,
              `- completed_at_utc: ${run.updated_at || 'unavailable'}`,
              `- run: [${run.id}](${run.html_url})`,
              '',
              'This bot-owned comment records the workflow_run completion payload. The linked run page is authoritative for job and step details.',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }

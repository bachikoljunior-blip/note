name: Repair Phase-1 Chat pool control
'on':
  push:
    branches: [main]
    paths: [.github/workflows/repair-phase1-chat-pool.yml]
permissions:
  contents: write
concurrency:
  group: repair-phase1-chat-pool
  cancel-in-progress: false

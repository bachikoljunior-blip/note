name: Revenue checkpoints

on:
  schedule:
    - cron: "17 0,12 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "state/current.json"
      - "scripts/check_checkpoints.py"
      - ".github/workflows/checkpoints.yml"

permissions:
  contents: read
  issues: write

jobs:
  checkpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: due
        name: Evaluate 48-hour and 7-day checkpoints
        run: python scripts/check_checkpoints.py
      - name: Create due checkpoint issues
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const state = JSON.parse(fs.readFileSync('state/current.json', 'utf8'));
            const due = [
              { key: '48h', active: '${{ steps.due.outputs.due_48h }}' === 'true', title: '計測: note公開48時間後', checkpoint: '48h' },
              { key: '7d', active: '${{ steps.due.outputs.due_7d }}' === 'true', title: '計測: note公開7日後', checkpoint: '7d' },
            ];
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            for (const item of due) {
              if (!item.active || existing.some(issue => issue.title === item.title)) continue;
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: item.title,
                body: [
                  `商品: ${state.publication.title}`,
                  `URL: ${state.publication.article_url}`,
                  '',
                  'noteのダッシュボードから次を記録してください。',
                  '- ビュー',
                  '- スキ',
                  '- コメント',
                  '- 購入数',
                  '- 売上',
                  '- 主な流入元や行った告知',
                  '',
                  `値は data/metrics.csv に checkpoint=${item.checkpoint} として追加します。`,
                ].join('\n'),
              });
            }

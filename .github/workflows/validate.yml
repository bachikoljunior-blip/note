name: Validate and analyze

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository state
        run: python scripts/validate.py
      - name: Verify public note page
        run: python scripts/verify_public_page.py
      - name: Generate latest metrics analysis
        run: python scripts/analyze_metrics.py
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-validation-${{ github.sha }}
          path: reports/
          retention-days: 7

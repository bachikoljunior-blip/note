name: Validate and analyze

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "27 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed if paid handoff repository is not private
        if: ${{ github.event.repository.private != true }}
        run: |
          echo "handoff/note_iPhone_handoff.zip contains paid product files and requires a private repository" >&2
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact user permanent directive and separation
        run: python scripts/check_directive_integrity.py
      - name: Test directive contamination detection and recovery behavior
        run: python scripts/test_directive_integrity.py
      - name: Enforce two-layer revenue automation continuity
        run: python scripts/check_automation_continuity_contract.py
      - name: Validate autonomous revenue factory
        run: python scripts/check_autonomous_revenue_factory.py
      - name: Rebuild and verify artifacts
        run: python scripts/rebuild_artifacts.py
      - name: Build and verify deterministic English product v1.1
        run: |
          python scripts/build_english_product.py
          sha256sum dist/Non_Repetitive_AI_Trivia_Shorts_Kit_EN_v1.1.zip > /tmp/english-product-before.sha256
          python scripts/build_english_product.py
          sha256sum dist/Non_Repetitive_AI_Trivia_Shorts_Kit_EN_v1.1.zip > /tmp/english-product-after.sha256
          diff -u /tmp/english-product-before.sha256 /tmp/english-product-after.sha256
      - name: Validate English product v1.1 before downstream builds
        run: python scripts/check_english_product_quality.py
      - name: Build zero-cost share launcher
        run: python scripts/build_share_launcher.py
      - name: Build channel-specific distribution pack
        run: python scripts/build_distribution_pack.py
      - name: Build evergreen funnel article launcher
        run: python scripts/build_funnel_article_launcher.py
      - name: Build structure-template funnel article launcher
        run: python scripts/build_structure_funnel_launcher.py
      - name: Build BOOTH sales-channel listing pack
        run: python scripts/build_booth_listing_launcher.py
      - name: Build BOOTH conversion visual pack
        run: python scripts/build_booth_visual_pack.py
      - name: Verify published BOOTH and build tracked share handoff
        run: |
          python scripts/build_booth_distribution_handoff.py
          git diff --exit-code -- handoff/BOOTH_SHARE.md
      - name: Build and verify durable private iPhone handoff
        run: |
          sha256sum handoff/note_iPhone_handoff.zip handoff/README.md > /tmp/iphone-handoff-before.sha256
          python scripts/build_iphone_handoff.py
          sha256sum handoff/note_iPhone_handoff.zip handoff/README.md > /tmp/iphone-handoff-after.sha256
          diff -u /tmp/iphone-handoff-before.sha256 /tmp/iphone-handoff-after.sha256
          python scripts/test_iphone_handoff.py
      - name: Build Gumroad conversion visual pack
        run: python scripts/build_gumroad_visual_pack.py
      - name: Revalidate English product v1.1 with visual evidence
        run: python scripts/check_english_product_quality.py --require-visual-report
      - name: Build Gumroad English sales-channel pack
        run: python scripts/build_gumroad_listing_launcher.py
      - name: Build and verify Gumroad iPhone listing pack
        run: |
          python scripts/build_gumroad_iphone_pack.py
          sha256sum dist/Gumroad_iPhone_Listing_Pack_v1.1.zip > /tmp/gumroad-iphone-before.sha256
          python scripts/build_gumroad_iphone_pack.py
          sha256sum dist/Gumroad_iPhone_Listing_Pack_v1.1.zip > /tmp/gumroad-iphone-after.sha256
          diff -u /tmp/gumroad-iphone-before.sha256 /tmp/gumroad-iphone-after.sha256
          python scripts/test_gumroad_iphone_pack.py
      - name: Validate official Gumroad CLI draft-only command contract
        run: python scripts/test_gumroad_cli_draft.py
      - name: Validate Gumroad manual resume checkpoint
        run: python scripts/check_gumroad_manual_checkpoint.py
      - name: Build deterministic Gumroad English distribution pack
        run: |
          python scripts/build_gumroad_distribution_pack.py
          sha256sum dist/gumroad_distribution_launcher.html dist/gumroad_distribution_pack.json dist/gumroad_distribution_pack.md > /tmp/gumroad-distribution-before.sha256
          python scripts/build_gumroad_distribution_pack.py
          sha256sum dist/gumroad_distribution_launcher.html dist/gumroad_distribution_pack.json dist/gumroad_distribution_pack.md > /tmp/gumroad-distribution-after.sha256
          diff -u /tmp/gumroad-distribution-before.sha256 /tmp/gumroad-distribution-after.sha256
      - name: Validate generated inline JavaScript
        run: python scripts/check_inline_javascript.py
      - name: Exercise Gumroad listing launcher runtime behavior
        run: python scripts/test_gumroad_listing_launcher_runtime.py
      - name: Validate repository state and revenue-funded budget
        run: python scripts/validate.py
      - name: Enforce automation before user requests
        run: python scripts/check_user_action_gate.py
      - name: Validate queued external mutations and safe fallback
        run: python scripts/check_external_mutation_queue.py
      - name: Validate revenue state coherence
        run: python scripts/check_revenue_state_coherence.py
      - name: Enforce continuation before yield
        run: |
          python scripts/test_continuation_gate.py
          python scripts/check_continuation_gate.py
      - name: Validate public page retry contract
        run: python scripts/test_verify_public_page_retry.py
      - name: Verify public note page
        run: python scripts/verify_public_page.py
      - name: Generate latest metrics analysis
        run: python scripts/analyze_metrics.py
      - name: Validate revenue checkpoint timing
        run: python scripts/check_checkpoints.py
      - name: Validate revenue checkpoint workflow contract
        run: python scripts/test_checkpoint_workflow.py
      - name: Validate default-branch evidence workflow contract
        run: python scripts/test_main_validation_evidence_workflow.py
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-validation-reports-${{ github.sha }}
          path: reports/
          retention-days: 7
      - name: Upload validated outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: note-validated-outputs-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.html
            dist/*.md
            dist/*.json
            dist/booth_visuals/*.png
            dist/gumroad_visuals/*.png
            handoff/*.zip
            handoff/*.md
          retention-days: 7

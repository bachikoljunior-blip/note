name: Validate and analyze

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact user permanent directive and separation
        run: python scripts/check_directive_integrity.py
      - name: Test directive contamination detection and recovery behavior
        run: python scripts/test_directive_integrity.py
      - name: Rebuild and verify artifacts
        run: python scripts/rebuild_artifacts.py
      - name: Build zero-cost share launcher
        run: python scripts/build_share_launcher.py
      - name: Build channel-specific distribution pack
        run: python scripts/build_distribution_pack.py
      - name: Build evergreen funnel article launcher
        run: python scripts/build_funnel_article_launcher.py
      - name: Build BOOTH sales-channel listing pack
        run: python scripts/build_booth_listing_launcher.py
      - name: Validate repository state and revenue-funded budget
        run: python scripts/validate.py
      - name: Enforce automation before user requests
        run: python scripts/check_user_action_gate.py
      - name: Verify public note page
        run: python scripts/verify_public_page.py
      - name: Generate latest metrics analysis
        run: python scripts/analyze_metrics.py
      - name: Upload reports and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-validation-${{ github.sha }}
          path: |
            reports/
            dist/*.zip
            dist/*.html
            dist/*.md
            dist/*.json
          retention-days: 7

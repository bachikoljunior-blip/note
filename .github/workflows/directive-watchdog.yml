name: Permanent directive watchdog

on:
  schedule:
    - cron: "11 1,13 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "OPERATIONS/CORE_DIRECTIVE.md"
      - "OPERATIONS/CORE_DIRECTIVE_MIRROR.md"
      - "OPERATIONS/CORE_DIRECTIVE.b64"
      - "OPERATIONS/DIRECTIVE_MANIFEST.json"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".github/copilot-instructions.md"
      - "OPERATIONS/BOOTSTRAP.md"
      - "scripts/check_directive_integrity.py"

permissions:
  contents: write
  issues: write

concurrency:
  group: permanent-directive-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: integrity
        name: Verify and repair a single damaged directive copy
        continue-on-error: true
        run: python scripts/check_directive_integrity.py --repair
      - id: changes
        name: Detect automatic repairs
        shell: bash
        run: |
          if git diff --quiet -- \
            OPERATIONS/CORE_DIRECTIVE.md \
            OPERATIONS/CORE_DIRECTIVE_MIRROR.md \
            OPERATIONS/CORE_DIRECTIVE.b64; then
            echo "repaired=false" >> "$GITHUB_OUTPUT"
          else
            echo "repaired=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit a safe single-copy repair
        if: steps.integrity.outcome == 'success' && steps.changes.outputs.repaired == 'true'
        shell: bash
        run: |
          git config user.name "note-directive-watchdog[bot]"
          git config user.email "note-directive-watchdog[bot]@users.noreply.github.com"
          git add \
            OPERATIONS/CORE_DIRECTIVE.md \
            OPERATIONS/CORE_DIRECTIVE_MIRROR.md \
            OPERATIONS/CORE_DIRECTIVE.b64
          git commit -m "Repair permanent directive redundant copy"
          git push origin HEAD:main
      - name: Open or update P0 integrity incident
        if: steps.integrity.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '[P0] 恒久指示の整合性エラー';
            let report = 'reports/directive_integrity.json was not generated';
            if (fs.existsSync('reports/directive_integrity.json')) {
              report = fs.readFileSync('reports/directive_integrity.json', 'utf8');
            }
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title);
            const body = [
              '恒久指示の3コピーまたは起動ポインタに、自動修復できない不整合を検出しました。',
              '',
              'このIssueが閉じるまで、収益・公開・ユーザー操作依頼に影響する自動変更を停止してください。',
              '',
              '```json',
              report.slice(0, 55000),
              '```',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
      - name: Close resolved integrity incident
        if: steps.integrity.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[P0] 恒久指示の整合性エラー';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            for (const issue of issues.filter(issue => issue.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '自動整合性検査が再び合格したため、このインシデントを閉じます。',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
      - name: Fail workflow when integrity remains broken
        if: steps.integrity.outcome != 'success'
        run: exit 1

<script id="article-data" type="application/json">{"title": "YouTube Shortsの台本が毎回同じになる原因｜4つの構成テンプレで量産感を減らす", "body": "AIに「このテーマでShortsの台本を書いて」と頼むと、テーマは違うのに、なぜか全部同じ動画に見えることがあります。\n\n- 「実は○○には驚きの理由があります」で始まる\n- 理由を3つ並べる\n- 最後に「知っていましたか？」で終わる\n- 背景、字幕、効果音まで毎回ほぼ同じ\n\n原因は、AIを使ったことそのものより、テーマだけを差し替えて構成を固定していることです。\n\nここでは、雑学・科学・仕組み解説のShortsで使える4つの構成を、具体例つきで紹介します。同じネタでも「何を見せる動画か」を変えるための無料チェックとして使ってください。\n\n## まず確認：テーマと構成は別物\n\nテーマは「何について話すか」です。\n\n構成は「視聴者にどんな順番で理解してもらうか」です。\n\nたとえば「飛行機の窓が丸い理由」という同じテーマでも、次のように別の動画へ変えられます。\n\n- 四角い窓という代案から始める\n- 窓の角にかかる力を見えるようにする\n- 過去から現在までの設計変更を時系列で追う\n- 丸い窓が一日だけ消えた世界を想像する\n\nテーマを増やす前に、構成の選択肢を増やすと、台本、映像、結論の重複をまとめて減らせます。\n\n## 構成1：見えない仕組みを可視化する\n\n普段は見えない力、信号、情報の流れを、一層ずつ見せる構成です。\n\n### 60秒の流れ\n\n1. 目に見える現象だけを出す\n2. 内部の一層目を見せる\n3. 力・信号・情報がどう動くかを追う\n4. 正常な場合と失敗する場合を比べる\n5. 最も重要な因果を一文で残す\n\n### 例\n\n「電子レンジの黒い網は、なぜ中を見せながらマイクロ波を止められるのか」\n\n最初に扉の外観を見せ、次に網の穴を拡大し、光とマイクロ波の違いを図にします。最後に「穴の大きさが、通れるものと通れないものを分けている」と戻せば、単なる理由の読み上げではなくなります。\n\n## 構成2：「なぜ別案ではない？」から始める\n\n視聴者が思いつきそうな代案を先に出し、それが採用されなかった理由を解く構成です。\n\n### 60秒の流れ\n\n1. 「普通なら○○にするはず」と代案を出す\n2. その代案の利点を認める\n3. 隠れた欠点を示す\n4. 現在の方式が残った理由を説明する\n5. 例外や限界があれば短く添える\n\n### 例\n\n「飛行機の窓は、景色が見やすい四角形ではだめなのか」\n\n四角形の利点から始め、角に力が集中する問題へ進み、現在の形につなげます。「丸いから安全」という結論だけを話すより、設計上の選択が見える動画になります。\n\n## 構成3：条件を一つだけ変える\n\n二つの状態を並べ、違いを一つに絞って原因を考える構成です。\n\n### 60秒の流れ\n\n1. 二つの条件を並べる\n2. 変えるのは一つだけと宣言する\n3. 結果の差を見せる\n4. 差が生まれた原因を説明する\n5. 当てはまらない条件も示す\n\n### 例\n\n「炭酸飲料は、ふたを閉めた時と開けた時で何が変わるのか」\n\n圧力という条件に焦点を当てれば、泡が突然生まれたように見える現象を、比較で説明できます。複数の理由を急いで並べるより、一本の因果が伝わりやすくなります。\n\n## 構成4：二択実験にする\n\n視聴者に先に予想してもらい、すぐ結果と理由を示す構成です。\n\n### 60秒の流れ\n\n1. 二択を出す\n2. 2秒だけ考える時間を置く\n3. 結果を見せる\n4. 予想が外れやすい理由を説明する\n5. 条件が変わるとどうなるかで締める\n\n### 例\n\n「鏡が反転しているのは左右と上下、どちら？」\n\n答えを急いで出さず、視聴者自身の予想を作ってから、鏡が反転している方向を説明します。問い、待ち時間、実演が加わるため、同じナレーション型から離れられます。\n\n## 構成を選ぶ3問\n\n企画ごとに、台本を書く前に次の3問へ答えます。\n\n1. 視聴者に最初に見せたいのは、現象・代案・比較・予想のどれか\n2. この企画で一番強いのは、内部の動き・設計理由・条件差・意外な結果のどれか\n3. 直近3本と違う画面や順番を作れるのはどれか\n\n最初の問いが決まれば、AIへの依頼も具体的になります。\n\n「台本を書いて」ではなく、「代案の利点を認めたあと、隠れた欠点を一つの因果で説明し、例外を一文添える」のように指示できます。\n\n## 公開前の重複チェック\n\n構成名だけを変えても、冒頭文、映像、結論が同じなら量産感は残ります。公開前に次を確認してください。\n\n- 直近3本と同じ冒頭文を使っていない\n- 同じ構成を連続させていない\n- 最初の画面が別動画と交換可能になっていない\n- 調査した出典と確認日を残した\n- この動画固有の比較、図解、実演のどれかがある\n- 結論が「すごい」「意外」だけで終わっていない\n\n## 4つを試した後に見る数字\n\n構成を変えた効果は、再生数だけで判断しません。\n\n- 冒頭を変えたら、初動の視聴継続\n- 説明順を変えたら、平均視聴時間や完了率\n- 二択や比較を入れたら、コメント・共有・保存\n- 商品導線を置いたら、リンククリックと売上\n\n一度に全部を変えず、「今回変えたもの」を記録すると、次の一本で何を残すか判断しやすくなります。\n\n## 同じテーマを4本に増やすのではなく、4案から1本を選ぶ\n\nここで紹介した構成は、同じ事実を薄く引き伸ばして4本投稿するためのものではありません。\n\n企画段階で4案を短く作り、題材に最も合う1案を選ぶために使います。\n\nたとえば「氷が水に浮く」というテーマなら、次の候補を出せます。\n\n- 見えない仕組み：水が凍る時の分子の並び方を可視化する\n- なぜ別案ではない：もし氷が沈む物質だったら湖で何が起きるかを考える\n- 条件を一つ変える：水と別の液体で、固体の位置を比較する\n- 二択実験：湖は表面と底のどちらから凍るかを予想してもらう\n\nこの中から、確認できる出典、用意できる映像、直近動画との違いを見て1案に絞ります。残り3案をそのまま投稿予定へ入れず、別の企画を考える時の視点として保存します。\n\nこうすると、本数を増やすための分割ではなく、一本を選ぶための比較になります。\n\n## 4本だけの小さな構成テスト\n\nいきなり30本分を作り直す必要はありません。まず4本だけ、題材の難易度を大きく変えずに構成を一つずつ試します。\n\n1本目は「見えない仕組み」、2本目は「なぜ別案ではない」、3本目は「条件を一つ変える」、4本目は「二択実験」にします。\n\n記録するのは、テーマ、構成、冒頭の言葉、最初の画面、公開時刻、視聴継続、完了率、共有・保存、商品リンクのクリックです。\n\n4本が終わったら、再生数が最大の一本だけを残すのではなく、次のように分けて判断します。\n\n- 冒頭が強かった構成\n- 最後まで説明を聞かれた構成\n- 共有や保存につながった構成\n- 商品導線と相性が良かった構成\n\n勝った構成を毎回使うのではなく、「どんな題材で機能したか」を残します。題材と構成の組み合わせを記録することで、次の企画選びに再利用できます。\n\n## 12構成・100企画をまとめて使いたい場合\n\n今回紹介した4構成は、私が作った「量産に見せないAI雑学Shorts制作キット」に入っている12構成の一部です。\n\n完全版には、100企画、12構成、調査・台本・映像プロンプト、公開前オリジナリティ監査、48時間・7日分析、30日実験カレンダーをまとめています。\n\n公開中の制作キットはこちらです。\n\nhttps://note.com/mobile_ai_studio/n/n779329665155?utm_source=note&utm_medium=organic&utm_campaign=structure_funnel_20260807&utm_content=article_cta\n\n※構成テンプレは再生数、収益、収益化審査を保証するものではありません。題材ごとの事実確認、素材の権利確認、公開前の内容確認を行ってください。"}</script>
<script>(()=>{'use strict';const data=JSON.parse(document.getElementById('article-data').textContent);const title=document.getElementById('title');const body=document.getElementById('body');const status=document.getElementById('status');body.value=data.body;async function copyText(text){if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return}const temp=document.createElement('textarea');temp.value=text;temp.setAttribute('readonly','');temp.style.position='fixed';temp.style.opacity='0';document.body.appendChild(temp);temp.select();const ok=document.execCommand('copy');temp.remove();if(!ok)throw new Error('copy failed')}async function run(text,message){try{await copyText(text);status.textContent=message}catch{status.textContent='自動コピーに失敗しました。入力欄を長押ししてコピーしてください。'}}document.getElementById('copyAll').addEventListener('click',()=>run(`${title.value.trim()}
